    // ==========================================
    // BKT ENGINE CLASS (IN-BROWSER IMPLEMENTATION)
    // ==========================================
    class BrowserBKT {
      static update(pKnown, isCorrect, hintsUsed = 0, responseTime = 12) {
        let pL = Math.max(0.01, Math.min(0.99, pKnown));
        let pGuess = 0.25;
        let pSlip = 0.10;
        let pTransit = 0.20;

        if (hintsUsed === 1) pGuess = 0.40;
        else if (hintsUsed >= 2) pGuess = 0.55;

        let num, den;
        if (isCorrect) {
          num = pL * (1.0 - pSlip);
          den = num + ((1.0 - pL) * pGuess);
        } else {
          num = pL * pSlip;
          den = num + ((1.0 - pL) * (1.0 - pGuess));
        }

        const pLGivenObs = Math.max(0.01, Math.min(0.99, num / Math.max(1e-5, den)));
        const pNext = Math.max(0.01, Math.min(0.99, pLGivenObs + (1.0 - pLGivenObs) * pTransit));

        return {
          prior: pKnown,
          posterior: pLGivenObs,
          nextPKnown: Math.round(pNext * 1000) / 1000,
          isMastered: pNext >= 0.80
        };
      }

      static selectDifficulty(pKnown, lastCorrect) {
        if (pKnown < 0.30) return 1;
        if (pKnown < 0.55) return lastCorrect ? 3 : 2;
        if (pKnown < 0.75) return lastCorrect ? 4 : 3;
        if (pKnown < 0.85) return 4;
        return 5;
      }
    }
